server:
  port: 8080

spring:
  application:
    name: knowledge-base
  
  # DevTools配置
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: static/**,public/**
    livereload:
      enabled: true
      port: 35729
  
  datasource:
    driver-class-name: org.postgresql.Driver
    # 通过环境变量切换到 PolarDB（MySQL 兼容）：
    #   DB_HOST=<polardb-endpoint>  DB_PORT=3306  DB_NAME=knowledge_base
    #   DB_USER=<user>  DB_PASSWORD=<password>
    url: jdbc:postgresql://localhost:5432/smart_search?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=${DB_USE_SSL:true}&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: postgres
    password: admin
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  # 保留注解级别的类型处理器绑定，避免全局将 Object 绑定为 jsonb 导致参数类型错配

# JWT配置
jwt:
  secret: knowledge-base-secret-key-2024-must-be-very-long-and-secure
  expiration: 604800  # 7天，单位：秒

# Python服务配置
python:
  service:
    url: http://localhost:8000

# 日志配置
logging:
  level:
    com.knowledge: debug
    org.springframework.security: debug

# Swagger配置 (2.9.2版本不需要特殊配置) 